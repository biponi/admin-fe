[build]
  command = "yarn build"
  publish = "build"

[build.environment]
  NODE_VERSION = "22"

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Asset Caching - JavaScript
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Asset Caching - CSS
[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Image assets
[[headers]]
  for = "/assets/*.{png,jpg,jpeg,gif,svg,ico}"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML - No caching for index.html
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# SPA Routing - Serve static files first, then redirect to index.html
# JavaScript files
[[redirects]]
  from = "/*.js"
  to = "/:splat"
  status = 200

# CSS files
[[redirects]]
  from = "/*.css"
  to = "/:splat"
  status = 200

# JSON and manifest files
[[redirects]]
  from = "/*.{json,webmanifest}"
  to = "/:splat"
  status = 200

# Image files
[[redirects]]
  from = "/*.{png,jpg,jpeg,gif,svg,ico,webp}"
  to = "/:splat"
  status = 200

# Font files
[[redirects]]
  from = "/*.{woff,woff2,ttf,otf,eot}"
  to = "/:splat"
  status = 200

# HTML files - explicit rule to prevent redirect loop
[[redirects]]
  from = "/*.html"
  to = "/:splat"
  status = 200

# Service worker
[[redirects]]
  from = "/sw.js"
  to = "/sw.js"
  status = 200

[[redirects]]
  from = "/registerSW.js"
  to = "/registerSW.js"
  status = 200

# PWA manifest
[[redirects]]
  from = "/manifest.webmanifest"
  to = "/manifest.webmanifest"
  status = 200

# SPA Catch-all - MUST come LAST to handle app routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false